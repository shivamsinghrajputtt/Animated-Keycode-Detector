<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A modern keyboard event inspector that displays key, code, keyCode, location, modifier, and repeat information." />
  <meta name="theme-color" content="#0072ff" />
  <meta property="og:title" content="Animated Keycode Detector" />
  <meta property="og:description" content="Inspect browser keyboard events in real time with an animated, responsive interface." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shivamsinghrajputtt.github.io/Animated-Keycode-Detector/" />
  <meta name="twitter:card" content="summary" />
  <title>Animated Keycode Detector</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Keyboard Event Inspector</p>
      <h1>Press any key to see the magic.</h1>
      <p class="subtitle">Explore exactly what your browser receives from every keyboard event.</p>
    </header>

    <section class="box" aria-label="Keyboard event details">
      <div class="key" aria-live="polite">—</div>
      <p class="status" role="status" aria-live="polite">Ready — press any key</p>

      <dl class="details-grid">
        <div class="detail-card"><dt>Code</dt><dd data-field="code">—</dd></div>
        <div class="detail-card"><dt>Legacy keyCode</dt><dd data-field="keyCode">—</dd></div>
        <div class="detail-card"><dt>Location</dt><dd data-field="location">—</dd></div>
        <div class="detail-card"><dt>Modifiers</dt><dd data-field="modifiers">None</dd></div>
        <div class="detail-card"><dt>Repeat</dt><dd data-field="repeat">No</dd></div>
      </dl>

      <div class="actions">
        <button id="copyButton" type="button">Copy details</button>
        <button id="resetButton" class="secondary" type="button">Reset</button>
      </div>
    </section>

    <p class="hint">Tip: Try letters, arrows, function keys, Space, Enter, and modifier combinations.</p>
  </main>

  <noscript>
    <p class="noscript-message">JavaScript is required to inspect keyboard events.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
